<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lifetime Insurance Brokers Weekly Results</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one centered report card — headline cost per lead, then three supporting numbers */
:root {
  --bg: #eef1f6;
  --card: #ffffff;
  --ink: #101a2c;
  --muted: #5b6678;
  --line: #dbe0e9;
  --navy: #14284b;
  --good: #1f8a5b;
  --good-soft: #e3f4ec;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1220; --card: #131d31; --ink: #eef2f8; --muted: #9aa6ba; --line: #24314a;
  --navy: #8fb0ea; --good: #4fd194; --good-soft: #143326; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1220; --card: #131d31; --ink: #eef2f8; --muted: #9aa6ba; --line: #24314a;
  --navy: #8fb0ea; --good: #4fd194; --good-soft: #143326; color-scheme: dark }

*,*::before,*::after{box-sizing:border-box} body { margin:0; background: var(--bg); color: var(--ink); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px; }
.card { max-width: 640px; margin: 0 auto; background: var(--card);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.head { padding: 28px 32px 0; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.client { font-family: var(--display); font-weight: 700; font-size: 20px; margin-top: 4px; }
.dates { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

.hero { padding: 36px 32px 32px; }
.hero .label { font-size: 15px; color: var(--muted); font-weight: 500; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(64px, 16vw, 104px);
  line-height: 1; letter-spacing: -0.03em; color: var(--navy); margin-top: 8px; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px;
  background: var(--good-soft); color: var(--good); font-weight: 600; font-size: 14px;
  padding: 6px 12px; border-radius: 999px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.stat { padding: 22px 32px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .n { font-family: var(--display); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 13px; color: var(--muted); margin-top: 4px; }

.foot { padding: 16px 32px 22px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

@media (max-width: 520px) {
  .head, .hero, .foot { padding-left: 20px; padding-right: 20px; }
  .stats { grid-template-columns: 1fr; }
  .stat { padding: 16px 20px; display: flex; justify-content: space-between; align-items: baseline; }
  .stat + .stat { border-left: 0; border-top: 1px solid var(--line); }
  .stat .n { font-size: 24px; }
}
</style>
</head><body>

<main class="card">
  <div class="head">
    <div>
      <div class="eyebrow">Facebook &amp; Instagram ads · Weekly results</div>
      <div class="client">Lifetime Insurance Brokers</div>
    </div>
    <div class="dates">Nov 8 – Nov 14, 2026</div>
  </div>

  <section class="hero">
    <div class="label">Cost per lead</div>
    <div class="big">$2.23</div>
    <div class="pill">↓ Down from $2.37 in late October</div>
  </section>

  <section class="stats">
    <div class="stat"><div class="n">1,146</div><div class="l">New leads</div></div>
    <div class="stat"><div class="n">~164</div><div class="l">Leads per day</div></div>
    <div class="stat"><div class="n">62,337</div><div class="l">People reached</div></div>
  </section>

  <div class="foot">Leads are form submissions from the Veteran Video Ads campaign, as reported in Meta Ads Manager.</div>
</main>
</body></html>
